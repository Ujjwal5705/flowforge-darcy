[project]
name = "flowforge"
version = "0.1.0"
description = "A reproducible Fourier neural operator service for the small Darcy benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
  "neuraloperator==2.0.0",
  "torch==2.8.0",
  "numpy==2.2.6",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "matplotlib==3.10.3",
  "safetensors==0.5.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.13", "huggingface-hub==0.33.0", "psutil==7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
